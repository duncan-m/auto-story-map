      - Add a Spreo item to the board's existing Export menu, next to the Visio, CSV and JSON downloads, so people who click Export see the tool by name. It links to the Spreo section of docs/integrations.md on the public GitHub repo and opens in a new tab.
      - Add docs/integrations.md with a Spreo section: how to create the board through Spreo's MCP integration from ChatGPT, Claude and Claude Code, with a copyable prompt for each that names the YAML source, release swimlanes, story IDs and estimates.
      - Explain in the guide that the board is a one-way snapshot, and that the prompt sends the internal map, including estimates and notes, to the AI tool and to Spreo.
      Acceptance criteria:
      - Internal viewers see Spreo in the Export menu; customer views never show the Export menu, as now.
      - The Spreo link opens the guide's Spreo section in a new tab, with rel="noopener", and works without JavaScript.
      - The Visio, CSV and JSON downloads keep working, and tests cover the new link for internal and customer views.
      - No Spreo API integration or import format is added to the library.
