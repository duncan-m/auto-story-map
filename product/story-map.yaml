# yaml-language-server: $schema=../story-map.schema.json
version: 1
id: auto-story-map
title: Auto Story Map Demo
summary: How product teams set up, plan, review and follow their story map, from the first release to what comes next.
visibility: all-users
customer:
  title: Auto Story Map Demo
  summary: What you can do with Auto Story Map today, and what is coming next.
settings:
  plans: docs/plans
  storyIds: lowest-free
# Drafted with ESM-901 from the README, the guide and the stories below. Every job is a draft until a person confirms it.
personas:
  - id: founder
    title: Solo Builder
    summary: Owns the product direction, chooses and builds the next release slice, and reviews changes made by coding agents in the repository.
    context:
      success: |-
        I can see what is in progress, what is next, and why it comes in that order.

        An agent can pick up the slice with the target customer, agreed scope, dependencies, and open decisions in a short brief.
      usesToday:
        - GitHub pull requests and diffs
        - Coding agents
        - Local story map preview
        - Story map CLI
      constraints:
        - Switches between product decisions, implementation, and review with limited time for administration.
        - Needs the agent to use the actual target customer, their situation, and the intended outcome when making implementation and UX decisions.
        - Wants material unknowns surfaced early. Low-impact, reversible decisions can proceed with the assumption recorded when it affects the work.
        - Starts with a compact brief for the selected slice and opens supporting detail as needed to keep agent context and token use low.
        - Needs a visual map that is easy to scan, navigate, and update while planning or reviewing delivery.
        - Approves scope and release decisions through the normal Git workflow.
      draft: true
    jobs:
      - id: get-oriented
        situation: I return to my project after a break or start a fresh coding agent session
        motivation: to recover my current plan, see what is in progress or blocked, and decide where to pick up
        outcome: I can resume work from a board that shows the current plan at a glance and lets me open the stories, dependencies, and evidence I need
        draft: true
        steps:
          - title: Open the map
            summary: Open my project's map in the local preview or retrieve the current release slice through the CLI.
            activity: set-up
          - title: Find the next available work
            summary: Read the current and next release slices, see what is blocked and why, and open delivery evidence when needed.
            activity: track
      - id: triage-backlog
        situation: I need to decide what to build next or change the order of planned work
        motivation: to see the next valuable customer outcome and the dependencies that determine a workable build order within and across release slices
        outcome: the agent and I share an ordered plan. I can move a slice in the board, see affected prerequisites, and review a focused Git patch.
        draft: true
        steps:
          - title: Choose the next slice
            summary: Review the release rows, choose the next outcome, and see which work needs to land first.
            activity: plan
          - title: Review the proposed move
            summary: Check which dependencies the move affects, then inspect the Git diff before applying it.
            activity: review
      - id: ground-work-in-customer-needs
        situation: I am shaping a slice or reviewing an agent proposal that affects the customer experience
        motivation: to make sure the agent understands the actual target customer, what they are trying to do, and the constraints that affect their choices
        outcome: I can see which customer need and evidence informed the proposal, and resolve any unknowns that could materially change the experience or scope
        draft: true
        steps:
          - title: Connect the slice to a customer job
            summary: Link the target persona, the job they are trying to do, the outcome the slice should support, and any relevant customer evidence.
            activity: plan
          - title: Resolve decisions that affect the outcome
            summary: Review the agent's open questions about customer needs, UX, scope, or dependencies before it commits to an affected implementation.
            activity: review
      - id: plan-and-build
        situation: I have chosen a release slice and am ready to build it with a coding agent
        motivation: to hand the agent enough customer and delivery context to do the work with minimal prompt repetition
        outcome: I can start the agent with a compact slice brief, then review the implementation and its delivery evidence in the repository
        draft: true
        steps:
          - title: Hand off the slice
            summary: Pass the relevant story IDs, target customer and job, desired outcome, agreed scope, dependency order, and open decisions. Link supporting detail the agent can retrieve as needed.
            activity: plan
          - title: Review the implementation
            summary: Review the implementation against the customer outcome and agreed scope, then check the map edits and delivery evidence beside the code.
            activity: review
      - id: share-roadmap
        situation: a collaborator needs delivery context or a customer asks what is coming
        motivation: to share the relevant roadmap view with the intended audience
        outcome: collaborators can review the working plan and customers can see approved updates on what is available or planned, using the same source map
        draft: true
      - id: keep-setup-current
        situation: a new version of Auto Story Map is out, and my repository was set up with an earlier one
        motivation: to understand what changes for my team and take the parts I want without losing the edits I made to my own set-up
        outcome: my agents follow the current rules and CI runs the current checks, and I know which of my own changes I kept
        draft: true
  - id: pm-inheriting-project
    title: Product Manager Inheriting an Existing Project
    summary: Takes product responsibility for a project that is already in use or being built, with limited documentation of its features, users, and prior decisions.
    context:
      success: I can show the team which journeys work today, who uses them, what is planned, and where we still have questions. We can agree on a credible next release from that shared view.
      usesToday:
        - The running product or a demo environment
        - Tickets, release notes and repository evidence
        - Customer conversations, support tickets, and usage data
        - Walkthroughs with people who know the product
      constraints:
        - Starts with partial documentation, fragmented evidence, and decisions that may exist only in people's heads.
        - May need engineering help to interpret repository evidence and confirm how a change reaches production.
        - Needs the agent to show the source and confidence of claims about current behaviour, delivery status, and customer needs.
        - Needs a board the wider team can read and review, with evidence available when a claim needs checking.
      draft: true
    jobs:
      - id: reconstruct-current-product
        situation: I take over a project with a running product or existing code and little documentation I can rely on
        motivation: to reconstruct the key user journeys and understand what is live, partly implemented, or still planned
        outcome: I have an initial story map that links claims to the evidence available and marks gaps or conflicting information for review
        draft: true
        steps:
          - title: Build the first view
            summary: Combine product walkthroughs, existing tickets and release notes, and any repository evidence the team can provide.
            activity: set-up
          - title: Inspect the current journeys
            summary: Follow each key journey, check the evidence for its delivery status, and identify the missing or conflicting pieces.
            activity: explore
      - id: recover-customer-context
        situation: the information I inherited leaves the intended users, customer jobs, or reasons for past decisions unclear
        motivation: to learn who relies on the product today, what they are trying to do, and where the experience causes friction
        outcome: the map links the main journeys to customer jobs supported by available research, usage, or support evidence and records what I still need to validate with customers
        draft: true
      - id: validate-inherited-map
        situation: the first map draws on sources that are incomplete, out of date, or inconsistent
        motivation: to use the map to ask focused questions and check which claims the team can confirm
        outcome: engineering, support, and I can agree on the current product baseline. Open questions and their evidence are visible on the map.
        draft: true
        steps:
          - title: Review the uncertain parts
            summary: Walk through disputed journeys, delivery claims, and inferred user needs with the people closest to the work.
            activity: review
      - id: agree-first-release-plan
        situation: I understand the current product and the team needs to agree on what to deliver next
        motivation: to weigh customer needs and inherited commitments alongside engineering dependencies
        outcome: the team has an agreed next release slice, a sensible build order, and a shared view of what is planned or blocked
        draft: true
        steps:
          - title: Agree the next slice
            summary: Review current commitments, customer outcomes, and prerequisites with the team, then capture the agreed scope and sequence in the map.
            activity: plan
          - title: Follow the plan with the team
            summary: Use the map in delivery discussions so the team can see changes to scope, dependencies, and delivery status.
            activity: track
  - id: agent
    title: Coding Agent
    summary: Picks up an agreed release slice, uses the target customer's job to guide implementation, and records delivery evidence for review.
    context:
      success: Can draft a map that makes its sources and gaps visible, or start from a compact slice brief and bring material uncertainties to the person responsible for product scope.
      usesToday:
        - AGENTS.md
        - Repository code, docs, and pull requests
        - Story map CLI
        - JSON export
      constraints:
        - Starts with the selected slice and retrieves linked personas, stories, or evidence when the task needs more detail.
        - Treats customer evidence, agreed decisions, and inferred assumptions as distinct inputs.
        - Asks the builder or product manager when uncertainty could materially change the customer experience, scope, or dependency order. Records meaningful, reversible assumptions when it can proceed.
        - Proposes scope changes and drafts through the project's review workflow, and leaves confirming drafts to a person.
      draft: true
    jobs:
      - id: pick-up-work
        situation: I start a new session or receive a request to work on a release slice
        motivation: to retrieve the smallest useful brief for the slice, including the target customer and job, agreed scope, prerequisites, and open decisions
        outcome: I can see what to work on now, what needs to land first, and which supporting detail to fetch when I need it
        draft: true
      - id: resolve-material-uncertainty
        situation: the slice leaves an open question about the target customer, intended UX, scope, or build order
        motivation: to establish which decisions are supported by evidence or already agreed and which depend on assumptions
        outcome: I can flag the material decision with a focused question and keep independent work moving. Lower-impact assumptions are visible for review when they affect the implementation.
        draft: true
      - id: update-the-map
        situation: a change I am delivering affects a story's implementation or delivery status
        motivation: to make a focused, valid edit and link the evidence that supports it
        outcome: reviewers can see what changed beside the code and distinguish merged work from work that has shipped
        draft: true
      - id: draft-first-map
        situation: a project has existing product behaviour or repository history and little reliable documentation
        motivation: to draft journeys from the available sources and flag gaps or conflicts in customer context, dependencies, and delivery evidence
        outcome: the product manager or builder can review each material claim with its source, see which parts are inferred, and decide what still needs to be checked.
        draft: true
  - id: customer
    title: Product Customer / Evaluator
    summary: An existing or prospective user of the product represented by a published map.
    context:
      success: Can tell whether the product meets a need today and whether a planned capability is worth waiting for.
      usesToday:
        - Product changelog
        - Published roadmap or in-app customer view
      constraints:
        - Sees approved customer-facing scope and wording.
        - Needs a clear distinction between available and planned work, with dates shown only when confirmed.
      draft: true
    jobs:
      - id: see-whats-coming
        situation: I am evaluating the product or looking for a capability I need
        motivation: to see what is available today and what is planned in a roadmap I can access
        outcome: I can decide whether the product fits now or whether it makes sense to wait
        draft: true
activities:
  - id: set-up
    title: Set up in a product
    summary: Install the package and serve the board behind the product’s sign-in.
    customer:
      title: Get started
  - id: plan
    title: Plan the map
    summary: Write activities, releases and stories in the YAML file, by hand or with an agent.
    customer:
      title: Plan your map
  - id: review
    title: Review changes
    summary: Check and summarise map changes in pull requests.
    customer:
      title: Review changes
  - id: explore
    title: Explore the board
    summary: Read the map, search it and open story details.
    customer:
      title: Explore the board
  - id: track
    title: Track delivery
    summary: See what changed, who changed it and what is stuck.
    customer:
      title: Follow progress
releases:
  - id: v0-1
    title: "0.1.0: First release"
    summary: The YAML format, the validator, audience views and the React board.
    notes: |
      A product can keep its story map in Git and show it at /story-map. Internal viewers see the full map; signed-in customers see only stories with approved customer copy.
    impact:
      - metric: Places the team tracks delivery
        expected: One map in the product repository instead of a separate planning tool
        solves: Plans drifting away from the code
        draft: true
    customer:
      title: "0.1.0"
  - id: v0-2
    title: "0.2.0: Engineering links"
    summary: Link stories to engineering docs, and give agents a first-run workflow.
    impact:
      - metric: Time to find the design behind a story
        expected: One click from the story to its engineering overview
        solves: Searching docs for the section that explains a story
        draft: true
    customer:
      title: "0.2.0"
  - id: v0-3
    title: "0.3.0: Board, search and history"
    summary: A new board with panels, search, change summaries, status history and npm publishing.
    notes: |
      The board became a grid of activity tiles and release lanes, with a detail panel for each story that works without client-side JavaScript.

      Pull requests get a summary of map changes, and the board shows when each story changed and who changed it.
    impact:
      - metric: Map changes reviewed in pull requests
        expected: Every map change shows a summary in its PR
        solves: Reviewers missing status and customer-facing changes in YAML diffs
        draft: true
    customer:
      title: "0.3.0"
  - id: v0-4
    title: "0.4.0: Delivery tracking"
    summary: Statuses for work that is merged, blocked or cut, release impact, stalled stories and “last updated” from Git.
    notes: |
      Teams can record why work stopped, what each release should change, and see which stories have been in progress too long.
    impact:
      - metric: Stories in progress for more than 4 weeks
        expected: Flagged on the board instead of found in stand-ups
        solves: Stuck work going unnoticed
        draft: true
      - metric: Releases with a stated expected impact
        expected: Every release with active stories
        solves: Releases planned without saying what they should change
        draft: true
    customer:
      title: "0.4.0"
  - id: v0-4-1
    title: "0.4.1: Filters apply as you choose"
    summary: An optional script applies the board’s filters as soon as they change, and the demo shows this library’s own map.
    impact:
      - metric: Steps to change a filter
        expected: One choice instead of a choice and a click on Apply
        solves: Viewers changing a filter and forgetting to apply it
        draft: true
    customer:
      title: "0.4.1"
  - id: v0-5
    title: "0.5.0: Collapsible releases and version footer"
    summary: Release lanes collapse to one line, and the board shows which version is running.
    impact:
      - metric: Scrolling past finished releases
        expected: Shipped releases collapse to one line and stay collapsed between visits
        solves: Long maps where the current release is far down the page
        draft: true
      - metric: Time to find which version a product runs
        expected: Read from the board’s footer, with a link to that version’s changelog
        solves: Checking the host’s lockfile to answer “do we have that fix?”
        draft: true
    customer:
      title: "0.5.0"
  - id: v0-6-1
    title: "0.6.1: Review and security fixes"
    summary: Fixes from the November 2026 code review, several of them for security, with one call to project and filter the map and a header that shows recent changes.
    impact:
      - metric: Known bugs and security risks from the code review
        expected: Fixed, or recorded as a decision, before 0.6.1 is published
        solves: Publishing a first version with known problems
        draft: true
  - id: v0-7-0
    title: "0.7.0: Export, test links and status choices"
    summary: Internal viewers download the map as a Visio or CSV file to import into Miro or Lucidchart, see the tests that cover each story, and filter by several statuses at once.
    notes: |
      A one-way snapshot of the board for workshops and planning sessions held in other tools. The YAML file stays the source of truth.

      Exports include every lane, with collapsed lanes kept collapsed, and at most the 200 most recently changed stories.
    impact:
      - metric: Time to get the story map into Miro or Lucidchart
        expected: One download and an import, instead of copying cards by hand
        solves: Teams retyping the map to run a workshop in another tool
        draft: true
      - metric: Stories with no tests behind them
        expected: Seen on the board from each card's test count and the tests in its panel
        solves: Asking engineers which tests cover a story before calling it done
        draft: true
  - id: v0-7-1
    title: "0.7.1: JSON export for agents"
    summary: Internal viewers and scripts export the whole map as JSON, with notes, sources, history and tagged tests, for an agent to review.
    impact:
      - metric: Time for an agent to review the map against the code
        expected: One JSON file with every story, its history and its tests, instead of reading the YAML, history and test files separately
        solves: Agents missing context when they suggest product work
        draft: true
  - id: v0-7-2
    title: "0.7.2: CLI to read, edit and preview the map"
    summary: Agents read the map, validate it and propose edits with story-map commands that print JSON, and anyone can preview their own map locally before adding the board to their product.
    notes: |
      Agents and scripts read the map with story-map story, stories and releases, get validation results as JSON, and change the map with story-map edit, add and release-impact, which show a dry run and only write a valid map. story-map preview shows any map as a board on your own computer before a product adds the board.

      The first half of the native CLI plan, moved ahead of personas so agents could tag stories with story-map edit instead of editing the YAML by hand. Evidence and claims follow in 0.7.5. Not published on its own: it reached npm in 0.7.4.
    impact:
      - metric: Map edits made by hand in the YAML file by agents
        expected: Made with story-map edit, which checks the change before writing it
        solves: Agents breaking the map or the guide's rules and finding out only when validate runs
        draft: true
      - metric: Time to see a new map as a board
        expected: One story-map preview command, before any host integration
        solves: Teams wiring up a board route behind their sign-in just to check their first map
        draft: true
  - id: v0-7-3
    title: "0.7.3: Personas"
    summary: Say who each story is for, and read the map one persona at a time.
    notes: |
      The map names the people the product serves and their jobs to be done, and each story says which jobs it serves. The board shows personas on cards and activities, filters by persona and job, and opens a panel with each persona's jobs and the stories that serve them. A Personas tab beside the map gives each persona a page, with their context and their jobs as lanes, core job first, each with its steps in order and the gaps marked.

      Not published on its own: it reached npm in 0.7.4.

      Mockup: docs/plans/personas.md#ui-mockup
      Personas tab mockup: docs/plans/personas.md#personas-tab-mockup
    impact:
      - metric: Stories on the map that show who they are for
        expected: Every active story names its personas on its card and in its panel
        solves: Readers guessing which users a story serves
        draft: true
      - metric: Alignment between engineers and product
        expected: Engineers and product agree who a story is for in the PR that adds it, not after it ships
        solves: Engineers and product working from different ideas of the user
        draft: true
      - metric: Stories that don't match user needs
        expected: Fewer, because each story names the jobs to be done it serves before work starts, and validate flags stories that serve none
        solves: Building stories that no persona needs
        draft: true
  - id: v0-7-4
    title: "0.7.4: Links to code and stories"
    summary: Internal viewers follow a story to its code, from the pull request and commit behind each history line and a list of the pull requests and commits that name it, and anyone can share a permalink to a story or release.
    notes: |
      Each line in a story's History links to the pull request and commit behind it, and a Changes section lists the merged pull requests and commits whose title, message or branch name names the story. Story, release and persona details open in a panel from the right, and each story and release panel has a Copy link button for a permalink that opens the board on it.

      Published to npm as 0.7.4 together with 0.7.2 and 0.7.3, which were not published on their own. It also brings effort estimates in story points (ESM-503), first planned for 0.7.6. The first version under the GNU AGPL.

      Plan: docs/plans/story-changes.md
    impact:
      - metric: Time to find the pull requests that delivered a story
        expected: One click from the story panel, instead of searching the repository for its ID
        solves: Asking engineers where a story's work was merged
        draft: true
  - id: v0-7-5
    title: "0.7.5: Evidence and claims for agents"
    summary: Agents look up the evidence for each story, including release tags that show merged work has shipped, and can claim stories when several agents work at once. Internal viewers copy an agent brief for a story or release from its panel, or open it in Claude, Claude Code or ChatGPT.
    notes: |
      The second half of the native CLI plan. It comes before the scheduled audit (ESM-109), which uses the evidence from ESM-105.

      Agent briefs (ESM-123, ESM-124 and ESM-125) come early, to test the brief format on real stories before the command-line brief in 0.8.0. Open in Claude Code (ESM-144) follows ESM-125, so a brief can start a Claude Code session on the web in the repository, not only a web chat. Its mockup is docs/plans/open-in-claude-code-mockup.html.

      Token counts (ESM-145) record the tokens used to deliver each story, in the pull request that finishes it. Mockup: docs/plans/token-usage.md#ui-mockup

      Plans: docs/plans/native-cli.md, docs/plans/agent-briefs.md and docs/plans/token-usage.md
    impact:
      - metric: Agents starting the same story at the same time
        expected: None, for teams that use claims
        solves: Duplicate work when several agents pick from one map
        draft: true
      - metric: Stories left in merged after their release goes out
        expected: Suggested as shipped by story-map evidence, for products that tag their releases
        solves: The map showing released work as not yet available
        draft: true
      - metric: Time to hand a story or release to a coding agent
        expected: One copy from its panel, instead of writing the prompt by hand
        solves: Agents starting work without the plan, the work already built nearby or the repository's rules
        draft: true
      - metric: Steps to start building a story in Claude Code on the web
        expected: One link from its panel opens a session in the repository with the brief filled in, instead of opening Claude Code, picking the repository and pasting the brief
        solves: A web chat that can plan a story from its brief but cannot read or build in the repository
        draft: true
      - metric: Stories merged with the tokens used to deliver them
        expected: Every story an agent finishes in Claude Code, from the pull request that marks it merged
        solves: Not knowing what agent work on a story used
        draft: true
  - id: v0-7-6
    title: "0.7.6: Triage, readiness and agent access"
    summary: People confirm drafts and triage stories without editing the YAML, see what validate warns about on an Actions tab, and see which stories are ready to start. Agents use the map through an MCP server or an installable skill, a repository with months of history gets a survey to draft its first map from, and the map can go to Spreo from the Export menu.
    notes: |
      The Actions tab (ESM-128) lists validate warnings on the board, beside the draft confirmation and triage work it points to (ESM-110 to ESM-112).

      From 0.8.1, readiness (ESM-139) says what can start now. ESM-142 and ESM-143 stay there.

      From 0.7.7, the skill, MCP server and survey (ESM-116 to ESM-118), reusing 0.7.5's evidence and claims.

      The Export menu gains a Spreo guide (ESM-137).

      Also: local persona editing (ESM-146, ESM-147, ESM-154 to ESM-156), priorities (ESM-158) and sticky titles (ESM-157).

      Plans: docs/plans/local-triage.md, docs/plans/actions-tab.md, docs/plans/0.8.0-agents-and-adoption.md and docs/plans/visual-dependency-map.md
      Mockups: docs/plans/export-to-external-tools.md#ui-mockup for the Spreo item, and docs/plans/visual-dependency-map.md#ui-mockup for readiness
    impact:
      - metric: Drafts confirmed or stories moved by editing the YAML by hand
        expected: Done with story-map confirm, or from the story panel in the local preview
        solves: People working alone switching to the YAML or an agent to confirm a draft or move a story
        draft: true
      - metric: Validation warnings only seen by people who run the CLI
        expected: "None: every warning is listed on the board's Actions tab"
        solves: Drafts, estimates and gaps waiting on product people who never see them
        draft: true
      - metric: Time to get the story map into Spreo
        expected: One click from the Export menu to a guide with a ready-made prompt, instead of working out the steps and prompt by hand
        solves: People who plan in Spreo not finding a way to move the map there from the Export menu
        draft: true
      - metric: Agent sessions that load the story map rules
        expected: Only sessions that work on the map, through the skill or the MCP server
        solves: Every agent session reading the story map section of AGENTS.md
        draft: true
      - metric: Time to draft a first map for a repository with months of history
        expected: One survey and one agent pass, citing the survey
        solves: Agents piecing together tags, changelogs and docs by hand
        draft: true
      - metric: Time to identify unfinished prerequisites for a story
        expected: Shown on the story panel and from the CLI instead of opening each related story
        solves: Unclear build order across dependent stories
        draft: true
    customer:
      title: "0.7.6"
  - id: v0-7-7
    title: "0.7.7: Delivery plans and test tags"
    summary: Hosts learn to write delivery plans from the guide, an example and a plan skeleton, with the rules in AGENTS.md and the story map skill, and a tag on a describe block covers every test inside it.
    notes: |
      The skill, the MCP server and the survey (ESM-116 to ESM-118) moved to 0.7.6. ESM-152 adds the planning rules to the skill from ESM-117.

      First, ESM-180 and ESM-159 to ESM-161 from Rules as checks, the plan checks that help build every later release.

      Plan: docs/plans/0.8.0-agents-and-adoption.md
      Plan for host planning guidance (ESM-148 to ESM-153): docs/plans/host-planning-guidance.md
      Plan for Rules as checks (ESM-159 to ESM-165 and ESM-180): docs/plans/rules-as-checks.md
    impact:
      - metric: Host plans that name what they build on and what they leave out
        expected: Plans written from the guide's structure, with builds-on, Not now and effort sections
        solves: Hosts getting the map mechanics but not the planning discipline behind them
        draft: true
      - metric: Plans whose status line disagrees with the map
        expected: None, because validate reports each one
        solves: Readers and agents trusting a stale plan status
        draft: true
      - metric: UI plans whose mockup is missing or not linked from a story
        expected: None, because validate reports each one
        solves: Reviewers finding a broken or unlinked mockup only when they open the plan
        draft: true
    customer:
      title: "0.7.7"
  - id: v0-7-8
    title: "0.7.8: Upgrade review"
    summary: On install and upgrade, story-map upgrade reports each part of a host's set-up, explains what changes in plain words, and applies the parts the person accepts, in a simple or an advanced mode.
    notes: |
      Planning proposal only. Today init never changes a part once it exists, so hosts keep the set-up they first installed. The review replaces the outdated-section report and decision C in the host planning guidance plan (ESM-150), and asks the delivery plans question from ESM-153 among its choices. It comes straight after 0.7.7, because existing hosts only get 0.7.7's AGENTS.md and guide changes through it. The Rules as checks changes in 0.7.9, such as pr-check, add their own parts to it. ESM-173 uses the rule IDs from ESM-159 in 0.7.7.

      Plan: docs/plans/upgrade-review.md
    impact:
      - metric: Hosts running a set-up older than the installed package
        expected: Told by validate after an upgrade, and brought current with one review
        solves: init skipping every part that already exists, so new rules and CI checks never reach existing hosts
        draft: true
      - metric: Host edits lost when upgrading the set-up
        expected: "None: simple mode keeps every edited part, and advanced mode shows the diff first"
        solves: People refusing upgrades because a tool once overwrote their own rules
        draft: true
  - id: v0-7-9
    title: "0.7.9: Rules in CI and claim checks"
    summary: story-map diff shows the map changes only a person should make, CI fails an agent's PR that makes one without a person's approval, and property and model-based tests check the audience filter, the edit safeguards and concurrent claims.
    notes: |
      Planning proposal only. The rest of Rules as checks, after ESM-180 and ESM-159 to ESM-161 in 0.7.7. ESM-162 to ESM-164 guard the draft confirmation and local editing from 0.7.6, and the upgrade review from 0.7.8 offers pr-check (ESM-163) to existing hosts. ESM-162 shares diff code with ESM-114 in 0.8.2. ESM-165 matters most once several agents regularly work on one map at the same time.

      Plan: docs/plans/rules-as-checks.md
    impact:
      - metric: Map changes only a person should make that reach main without a person approving them
        expected: "None from agent-written commits: pr-check fails the PR until a person approves"
        solves: Drafts confirmed, estimates set or stories deleted by an agent, unnoticed in review
        draft: true
      - metric: Rules in AGENTS.md that nothing checks
        expected: Only rules that need judgement, such as when customer copy is approved and when to set updatedBy
        solves: Agents breaking written rules that a reviewer then has to catch in a YAML diff
        draft: true
      - metric: Stories held by two agents at once
        expected: None, with the claim rules checked by a model-based test on every CI run
        solves: Two agents building the same story when they claim it at the same moment
        draft: true
  - id: v0-8-0
    title: "0.8.0: Agent briefs"
    summary: Agents and scripts print a brief for a story, release or activity with story-map brief.
    notes: |
      Builds on the briefs copied from the board in 0.7.5 and the MCP server in 0.7.6 (ESM-116), which gets a get_brief tool. Starting a local agent from the preview (ESM-127) was cut: Open in Claude Code (ESM-144) and Copy brief (ESM-124) already cover it.

      Plan: docs/plans/agent-briefs.md
    impact:
      - metric: Steps to start a local agent on a story
        expected: One story-map brief command or get_brief call
        solves: Copying a brief from the board and pasting it into a terminal
        draft: true
  - id: v0-8-1
    title: "0.8.1: Dependency planning and graph"
    summary: See a dependency-respecting build order and dependency risks, in the release panel, CLI and agent briefs, and explore a release's or a story's dependency chain as an internal, read-only graph, without maintaining another planning system.
    notes: |
      Planning proposal only, built on the existing dependsOn links from ESM-129 and the readiness from ESM-139, which moved to 0.7.6. A suggested order in the release panel and CLI (ESM-142) and prerequisites in agent briefs (ESM-143). Then an internal Dependencies tab with a server-rendered graph and list (ESM-140), and release and story focus with a full-chain option (ESM-141), which moved here from the former 0.8.5: Dependency graph and reuse the readiness and order. No editable graph or new dependency storage.

      Plan: docs/plans/visual-dependency-map.md
      Mockup: docs/plans/visual-dependency-map.md#ui-mockup
    impact:
      - metric: Time to find a feasible sequence for a release
        expected: A ready set and dependency-respecting order in the release panel and CLI
        solves: Repeated manual tracing of story links
        draft: true
      - metric: Release-order conflicts identified before implementation
        expected: Warnings for prerequisites that are cut, blocked or in later releases
        solves: Hidden cross-release, cut and blocked prerequisites
        draft: true
      - metric: Time to see why a release cannot start
        expected: One view of the release and its prerequisites from other releases, instead of following links story by story
        solves: Long prerequisite chains that span several releases
        draft: true
  - id: v0-8-2
    title: "0.8.2: Map versions, steps and audit"
    summary: Earlier versions of the map can be read, compared and viewed on the board, activities expand into steps, and a scheduled audit proposes map corrections from the code.
    notes: |
      Split from the original 0.7.6. Reading and comparing versions (ESM-113 and ESM-114) come before the board's Version picker (ESM-115), which depends on both. The audit (ESM-109) uses the evidence from ESM-105 in 0.7.5.

      Activity and release titles stay in view while the board scrolls (ESM-157). Mockup: docs/plans/sticky-board-headings.md#ui-mockup

      Plans: docs/plans/map-versions.md, docs/plans/0.4.0-enhancements.md and docs/plans/sticky-board-headings.md
    impact:
      - metric: Map changes that are missing from feature PRs
        expected: Found by the weekly audit and proposed in a PR
        solves: The map drifting from the code when a PR forgets to update it
        draft: true
      - metric: Time to see what the map said at an earlier release or review
        expected: One command or one choice in the board's Version picker
        solves: Checking out old commits, or asking an agent, to see a past plan
        draft: true
      - metric: Scrolling back up to see which activity or release a card belongs to
        expected: "None: both titles stay in view as the board scrolls"
        solves: Losing track of the column and lane on maps with many releases
        draft: true
    customer:
      title: "0.8.2"
  - id: v0-8-3
    title: "0.8.3: Delivery visibility"
    summary: Git-native burn-up, burn-down, throughput, velocity and release progress without maintaining sprints.
    notes: |
      Planning proposal only. Calculated from the map and the history file from story-map history, with no new generated file; metrics remain internal.
      Starts with a spike, ESM-174: an Analytics tab of stories, points, tokens and spend per day, week or month. The full metrics, ESM-130 to ESM-134, follow on from it.
      Plan: docs/plans/delivery-metrics.md
      Mockup: docs/plans/delivery-metrics-mockup.html
    impact:
      - metric: Time to understand progress and scope change for a release
        expected: One analytics view without manual reporting
        solves: Reading multiple commits and manually calculating remaining work
        draft: true
  - id: v0-8-4
    title: "0.8.4: Delivery intelligence"
    summary: Lead time, release baselines and cumulative flow to find bottlenecks.
    notes: |
      Builds on 0.8.3's history events and daily series. No mandatory estimates or new database.
      Plan: docs/plans/delivery-metrics.md
    impact:
      - metric: Effort to assess release predictability and bottlenecks
        expected: Review lead time, scope change since baseline and observed flow in one place
        solves: Guessing delivery dates from recent commits or individual stories
        draft: true
