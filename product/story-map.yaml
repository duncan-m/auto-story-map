# yaml-language-server: $schema=../story-map.schema.json
version: 1
id: auto-story-map
title: Auto Story Map Demo
summary: How product teams set up, plan, review and follow their story map, from the first release to what comes next.
visibility: all-users
customer:
  title: Auto Story Map Demo
  summary: What you can do with Auto Story Map today, and what is coming next.
# Drafted with ESM-901 from the README, the guide and the stories below. Every job is a draft until a person confirms it.
personas:
  - id: pm
    title: Product manager
    summary: Owns the roadmap and decides what goes in each release.
    context:
      success: Each release lands with the scope agreed when it was planned
      usesToday: [GitHub pull requests, The board in the product, Asking engineers]
      constraints:
        - Does not edit the YAML, so relies on engineers or agents to change the map
        - Shares plans with customers only through approved customer copy
      draft: true
    jobs:
      - id: plan-release
        situation: a release is being planned
        motivation: to agree its scope in the PR that changes the map
        outcome: engineers and product start from the same list
        draft: true
      - id: answer-whats-next
        situation: someone asks what is in the next release
        motivation: to open the map inside the product
        outcome: I can answer without asking engineering
        draft: true
      - id: track-progress
        situation: a release is under way
        motivation: to see what has shipped, what is stuck and what is left
        outcome: I know whether it will land as planned
        draft: true
      - id: share-roadmap
        situation: customers ask what is coming
        motivation: to show them approved stories only
        outcome: I can answer without leaking internal work
        draft: true
      - id: plan-in-other-tools
        situation: we plan in a workshop or diagram tool
        motivation: to bring the current map into it
        outcome: the session starts from the agreed plan, not a copy typed by hand
        draft: true
  - id: engineer
    title: Engineer
    summary: Builds the product and keeps the map in step with the code.
    context:
      success: The map changes in the same pull request as the code, and CI passes
      usesToday: [GitHub pull requests, CI checks, The story-map CLI]
      constraints:
        - Serves the board behind the product's own sign-in, with no separate service
      draft: true
    jobs:
      - id: set-up-host
        situation: my product adopts the story map
        motivation: to add it in a few steps, with checks in CI
        outcome: it works behind our sign-in without custom code
        draft: true
      - id: review-in-context
        situation: a pull request changes the map
        motivation: to see what moved and why, next to the code
        outcome: I review the scope with the change
        draft: true
      - id: find-the-code
        situation: I pick up or review a story
        motivation: to reach its plan, tests and code from the story
        outcome: I start from what is already known
        draft: true
  - id: agent
    title: Coding agent
    summary: Plans and delivers changes in the repository, and keeps the map up to date as it goes.
    context:
      success: Its pull requests use the right story IDs and pass validation first time
      usesToday: [The story-map CLI, AGENTS.md, The JSON export]
      constraints:
        - Reads the map from the repository and the CLI, not the board
        - Cannot confirm drafts, because only a person removes draft
      draft: true
    jobs:
      - id: draft-first-map
        situation: a product has no map yet
        motivation: to draft one from the product's docs and code
        outcome: the team reviews a draft instead of starting from a blank file
        draft: true
      - id: read-the-map
        situation: I start a task
        motivation: to find the stories it touches without reading the YAML by hand
        outcome: my plan uses the right story IDs
        draft: true
      - id: update-the-map
        situation: my change affects a story
        motivation: to make the smallest valid edit to the map
        outcome: reviewers see the map change with the code
        draft: true
  - id: customer
    title: Product customer
    summary: A signed-in user of the host product who sees the customer view.
    context:
      success: Knows whether something they need is coming, without asking support
      usesToday: [The customer view of the board, Asking support]
      constraints:
        - Sees only approved customer copy, never internal stories
      draft: true
    jobs:
      - id: see-whats-coming
        situation: I wonder whether something I need is coming
        motivation: to see the product's plans inside the product
        outcome: I can plan around them without asking support
        draft: true
activities:
  - id: set-up
    title: Set up in a product
    summary: Install the package and serve the board behind the product’s sign-in.
    customer:
      title: Get started
  - id: plan
    title: Plan the map
    summary: Write activities, releases and stories in the YAML file, by hand or with an agent.
    customer:
      title: Plan your map
  - id: review
    title: Review changes
    summary: Check and summarise map changes in pull requests.
    customer:
      title: Review changes
  - id: explore
    title: Explore the board
    summary: Read the map, search it and open story details.
    customer:
      title: Explore the board
  - id: track
    title: Track delivery
    summary: See what changed, who changed it and what is stuck.
    customer:
      title: Follow progress
releases:
  - id: v0-1
    title: "0.1.0: First release"
    summary: The YAML format, the validator, audience views and the React board.
    notes: |
      A product can keep its story map in Git and show it at /story-map. Internal viewers see the full map; signed-in customers see only stories with approved customer copy.
    impact:
      - metric: Places the team tracks delivery
        expected: One map in the product repository instead of a separate planning tool
        solves: Plans drifting away from the code
        draft: true
    customer:
      title: "0.1.0"
  - id: v0-2
    title: "0.2.0: Engineering links"
    summary: Link stories to engineering docs, and give agents a first-run workflow.
    impact:
      - metric: Time to find the design behind a story
        expected: One click from the story to its engineering overview
        solves: Searching docs for the section that explains a story
        draft: true
    customer:
      title: "0.2.0"
  - id: v0-3
    title: "0.3.0: Board, search and history"
    summary: A new board with panels, search, change summaries, status history and npm publishing.
    notes: |
      The board became a grid of activity tiles and release lanes, with a detail panel for each story that works without client-side JavaScript.

      Pull requests get a summary of map changes, and the board shows when each story changed and who changed it.
    impact:
      - metric: Map changes reviewed in pull requests
        expected: Every map change shows a summary in its PR
        solves: Reviewers missing status and customer-facing changes in YAML diffs
        draft: true
    customer:
      title: "0.3.0"
  - id: v0-4
    title: "0.4.0: Delivery tracking"
    summary: Statuses for work that is merged, blocked or cut, release impact, stalled stories and “last updated” from Git.
    notes: |
      Teams can record why work stopped, what each release should change, and see which stories have been in progress too long.
    impact:
      - metric: Stories in progress for more than 4 weeks
        expected: Flagged on the board instead of found in stand-ups
        solves: Stuck work going unnoticed
        draft: true
      - metric: Releases with a stated expected impact
        expected: Every release with active stories
        solves: Releases planned without saying what they should change
        draft: true
    customer:
      title: "0.4.0"
  - id: v0-4-1
    title: "0.4.1: Filters apply as you choose"
    summary: An optional script applies the board’s filters as soon as they change, and the demo shows this library’s own map.
    impact:
      - metric: Steps to change a filter
        expected: One choice instead of a choice and a click on Apply
        solves: Viewers changing a filter and forgetting to apply it
        draft: true
    customer:
      title: "0.4.1"
  - id: v0-5
    title: "0.5.0: Collapsible releases and version footer"
    summary: Release lanes collapse to one line, and the board shows which version is running.
    impact:
      - metric: Scrolling past finished releases
        expected: Shipped releases collapse to one line and stay collapsed between visits
        solves: Long maps where the current release is far down the page
        draft: true
      - metric: Time to find which version a product runs
        expected: Read from the board’s footer, with a link to that version’s changelog
        solves: Checking the host’s lockfile to answer “do we have that fix?”
        draft: true
    customer:
      title: "0.5.0"
  - id: v0-6-1
    title: "0.6.1: Review and security fixes"
    summary: Fixes from the November 2026 code review, several of them for security, with one call to project and filter the map and a header that shows recent changes.
    impact:
      - metric: Known bugs and security risks from the code review
        expected: Fixed, or recorded as a decision, before 0.6.1 is published
        solves: Publishing a first version with known problems
        draft: true
  - id: v0-7-0
    title: "0.7.0: Export, test links and status choices"
    summary: Internal viewers download the map as a Visio or CSV file to import into Miro or Lucidchart, see the tests that cover each story, and filter by several statuses at once.
    notes: |
      A one-way snapshot of the board for workshops and planning sessions held in other tools. The YAML file stays the source of truth.

      Exports include every lane, with collapsed lanes kept collapsed, and at most the 200 most recently changed stories.
    impact:
      - metric: Time to get the story map into Miro or Lucidchart
        expected: One download and an import, instead of copying cards by hand
        solves: Teams retyping the map to run a workshop in another tool
        draft: true
      - metric: Stories with no tests behind them
        expected: Seen on the board from each card's test count and the tests in its panel
        solves: Asking engineers which tests cover a story before calling it done
        draft: true
  - id: v0-7-1
    title: "0.7.1: JSON export for agents"
    summary: Internal viewers and scripts export the whole map as JSON, with notes, sources, history and tagged tests, for an agent to review.
    impact:
      - metric: Time for an agent to review the map against the code
        expected: One JSON file with every story, its history and its tests, instead of reading the YAML, history and test files separately
        solves: Agents missing context when they suggest product work
        draft: true
  - id: v0-7-2
    title: "0.7.2: CLI to read, edit and preview the map"
    summary: Agents read the map, validate it and propose edits with story-map commands that print JSON, and anyone can preview their own map locally before adding the board to their product.
    notes: |
      The first half of the native CLI plan, moved ahead of personas so agents can tag the existing stories with story-map edit instead of editing the YAML by hand. Evidence and claims follow in 0.7.5.
    impact:
      - metric: Map edits made by hand in the YAML file by agents
        expected: Made with story-map edit, which checks the change before writing it
        solves: Agents breaking the map or the guide's rules and finding out only when validate runs
        draft: true
      - metric: Time to see a new map as a board
        expected: One story-map preview command, before any host integration
        solves: Teams wiring up a board route behind their sign-in just to check their first map
        draft: true
  - id: v0-7-3
    title: "0.7.3: Personas"
    summary: Say who each story is for, and read the map one persona at a time.
    notes: |
      The map names the people the product serves and their jobs to be done, and each story says which jobs it serves. The board shows personas on cards and activities, filters by persona and job, and opens a panel with each persona's jobs and the stories that serve them.

      Mockup: docs/plans/personas.md#ui-mockup
    impact:
      - metric: Stories on the map that show who they are for
        expected: Every active story names its personas on its card and in its panel
        solves: Readers guessing which users a story serves
        draft: true
      - metric: Alignment between engineers and product
        expected: Engineers and product agree who a story is for in the PR that adds it, not after it ships
        solves: Engineers and product working from different ideas of the user
        draft: true
      - metric: Stories that don't match user needs
        expected: Fewer, because each story names the jobs to be done it serves before work starts, and validate flags stories that serve none
        solves: Building stories that no persona needs
        draft: true
  - id: v0-7-4
    title: "0.7.4: Links to code and stories"
    summary: Internal viewers follow a story to its code, from the pull request and commit behind each history line and a list of the pull requests and commits that name it, and anyone can share a permalink to a story or release.
    impact:
      - metric: Time to find the pull requests that delivered a story
        expected: One click from the story panel, instead of searching the repository for its ID
        solves: Asking engineers where a story's work was merged
        draft: true
  - id: v0-7-5
    title: "0.7.5: Evidence and claims for agents"
    summary: Agents look up the evidence for each story, including release tags that show merged work has shipped, and can claim stories when several agents work at once.
    notes: |
      The second half of the native CLI plan. It comes before the scheduled audit (ESM-502), which uses the evidence from ESM-743.
    impact:
      - metric: Agents starting the same story at the same time
        expected: None, for teams that use claims
        solves: Duplicate work when several agents pick from one map
        draft: true
      - metric: Stories left in merged after their release goes out
        expected: Suggested as shipped by story-map evidence, for products that tag their releases
        solves: The map showing released work as not yet available
        draft: true
  - id: v0-7-6
    title: "0.7.6: PM improvements"
    summary: Activities expand into steps, stories carry effort estimates with a total on each release, and a scheduled audit proposes map corrections from the code.
    impact:
      - metric: Map changes that are missing from feature PRs
        expected: Found by the weekly audit and proposed in a PR
        solves: The map drifting from the code when a PR forgets to update it
        draft: true
    customer:
      title: "0.7.6"
