name: Story map

on:
  pull_request:
    # edited and labeled re-run pr-check when the description or the map-approved label changes.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    paths:
      - product/story-map.yaml
      - docs/**
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  validate:
    name: Validate the story map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # story-map diff compares with the base branch
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      # Add --plans <folder> to check story IDs mentioned in delivery plans, and
      # --tests <folder> to check story IDs in test names.
      - run: npx --no-install story-map validate --format github --check-sources product/story-map.yaml
      - name: Summarise story map changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx --no-install story-map diff "origin/$BASE_REF" >> "$GITHUB_STEP_SUMMARY"
      # Fails when an agent's commits make a change only a person should make, unless a
      # person adds the map-approved label, or when a story is marked merged without a
      # Tokens used section in the description.
      - name: Check the pull request against the map rules
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'map-approved') && 'yes' || '' }}
        run: printf '%s' "$PR_BODY" | npx --no-install story-map pr-check --format github ${APPROVED:+--approved} --body-file - "origin/$BASE_REF"
