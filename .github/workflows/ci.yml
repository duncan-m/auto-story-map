name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  library-and-package:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '26']
        react: ['18', '19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # story-map diff compares with the base branch
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Lint
        if: matrix.node == '26' && matrix.react == '19'
        run: npm run lint -- --reporter=github
      - run: node dist/cli.js validate --format github --check-sources --plans docs --tests test product/story-map.yaml
      - name: Summarise story map changes
        if: github.event_name == 'pull_request' && matrix.node == '26' && matrix.react == '19'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node dist/cli.js diff "origin/$BASE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the tests
        if: matrix.node != '26' || matrix.react != '19'
        run: npm test
      # One cell measures coverage and checks the floors in .c8rc.json (ESM-177). The others run the tests without it.
      - name: Run the tests with coverage
        if: matrix.node == '26' && matrix.react == '19'
        run: npm run coverage
      - name: Summarise test coverage
        if: ${{ !cancelled() && matrix.node == '26' && matrix.react == '19' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Check the committed JSON Schema is up to date
        run: git diff --exit-code -- story-map.schema.json
      - name: Smoke-test the packed npm package
        env:
          REACT_MAJOR: ${{ matrix.react }}
        run: bash scripts/smoke-package.sh "$REACT_MAJOR"
