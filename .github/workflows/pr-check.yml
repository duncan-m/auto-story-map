name: Map rules

# A workflow of its own, so editing the description or the map-approved label,
# or marking the pull request ready, re-runs this check without re-running the
# whole CI matrix.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  pr-check:
    name: Pull request follows the map rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # pr-check reads the commits since the base branch
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Fails when an agent's commits make a change only a person should make, unless a
      # person adds the map-approved label, or when a story is marked merged without a
      # Tokens used section in the description. Warns when a pull request that is ready
      # for review has no Review section that records a review; a draft is never warned.
      - name: Check the pull request against the map rules
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'map-approved') && 'yes' || '' }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: printf '%s' "$PR_BODY" | node dist/cli.js pr-check --format github ${APPROVED:+--approved} --draft "$DRAFT" --body-file - "origin/$BASE_REF"
