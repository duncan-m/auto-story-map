name: Release

# Push a tag such as v0.3.0 to publish that version to npm. See docs/releasing.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '26']
        react: ['18', '19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node dist/cli.js validate --format github --check-sources --plans docs product/story-map.yaml
      - run: npm test
      - name: Check the committed JSON Schema is up to date
        run: git diff --exit-code -- story-map.schema.json
      - name: Smoke-test the packed npm package
        env:
          REACT_MAJOR: ${{ matrix.react }}
        run: bash scripts/smoke-package.sh "$REACT_MAJOR"

  pack:
    # Builds the tarball that publish uploads. This job has no publishing
    # permissions, so nothing it installs can ask for an npm token.
    name: Pack
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack the package
        id: pack
        # The build has just run, so skip prepare instead of building twice.
        run: |
          tarball="$(npm pack --ignore-scripts --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    # Never install dependencies in this job. Every step here can ask GitHub
    # for the OpenID Connect token that npm trusted publishing accepts, so a
    # dependency's install script could use it to publish a malicious version
    # with valid provenance. It only checks and publishes the tarball from pack.
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
      - name: Check the tag matches package.json, the tarball and the changelog
        env:
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ runner.temp }}/package/${{ needs.pack.outputs.tarball }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
          packed="$(tar -xOzf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "$packed" != "$version" ]; then
            echo "::error::The packed tarball has version $packed, not $version."
            exit 1
          fi
          if ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
      - name: Check whether this version is already on npm
        id: npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "auto-story-map@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::auto-story-map@$version is already on npm, so only the GitHub release will be created."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        # Authenticates with npm trusted publishing, so no npm token is stored in the repository.
        # Publishing a tarball runs no lifecycle scripts; --ignore-scripts keeps it that way.
        if: steps.npm.outputs.published != 'true'
        env:
          TARBALL: ${{ runner.temp }}/package/${{ needs.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public --ignore-scripts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
