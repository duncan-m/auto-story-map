name: Release

# Push a tag such as v0.3.0 to publish that version to npm. See docs/releasing.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '26']
        react: ['18', '19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node dist/cli.js validate --format github --check-sources --plans docs product/story-map.yaml
      - run: npm test
      - name: Check the committed JSON Schema is up to date
        run: git diff --exit-code -- story-map.schema.json
      - name: Smoke-test the packed npm package
        env:
          REACT_MAJOR: ${{ matrix.react }}
        run: bash scripts/smoke-package.sh "$REACT_MAJOR"

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the tag matches package.json and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
          if ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
      - run: npm ci
      - name: Check whether this version is already on npm
        id: npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "embedded-story-map@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::embedded-story-map@$version is already on npm, so only the GitHub release will be created."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        # Authenticates with npm trusted publishing, so no npm token is stored in the repository.
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
