name: OSV-Scanner Scheduled Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
