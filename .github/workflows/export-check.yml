name: Export check

# Checks that a third-party Visio reader opens the exported file. Runs only when
# export code changes, because installing LibreOffice is slow.
on:
  pull_request:
    paths:
      - "src/export*.ts"
      - "src/zip.ts"
      - "scripts/export-sample-vsdx.mjs"
      - "test/fixtures/**"
      - ".github/workflows/export-check.yml"

permissions:
  contents: read

jobs:
  vsdx-opens:
    name: LibreOffice opens the .vsdx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-draw
      - run: node scripts/export-sample-vsdx.mjs out.vsdx
      - run: soffice --headless --convert-to pdf out.vsdx
      - name: Check a PDF was produced
        run: test -s out.pdf
